# ==========================================
# 户外徒步活动管理系统 - 主配置文件
# ==========================================

spring:
  # 激活的环境配置
  profiles:
    active: @spring.profiles.active@

  # 应用信息
  application:
    name: backend

  # Jackson 配置
  jackson:
    # 时区设置
    time-zone: GMT+8
    # 日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    # 序列化配置
    serialization:
      # 格式化输出
      indent_output: true
      # 忽略空值
      write_dates_as_timestamps: false
    # 反序列化配置
    deserialization:
      # 忽略未知属性
      fail_on_unknown_properties: false

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件最大大小
      max-file-size: 10MB
      # 总上传数据最大大小
      max-request-size: 50MB
      # 是否启用文件上传
      enabled: true

# ==========================================
# MyBatis Plus 配置
# ==========================================
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 实体类扫描路径
  type-aliases-package: com.hiking.entity
  # 全局配置
  global-config:
    # 数据库配置
    db-config:
      # 主键策略 (AUTO 自增)
      id-type: AUTO
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值(删除后的值)
      logic-delete-value: 1
      # 逻辑未删除值(未删除的值)
      logic-not-delete-value: 0
    # Banner 关闭
    banner: false
  # 配置
  configuration:
    # 驼峰命名自动转换
    map-underscore-to-camel-case: true
    # 开启缓存
    cache-enabled: true
    # 日志实现 (开发环境使用，生产环境注释掉)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回 Map 时，null 值也映射
    call-setters-on-nulls: true

# ==========================================
# JWT 配置
# ==========================================
jwt:
  # 密钥 (生产环境务必修改为复杂字符串)
  secret: outdoor-hiking-system-jwt-secret-key-2025-change-me-in-production
  # 过期时间 (单位: 毫秒, 7天)
  expiration: 604800000
  # Token 前缀
  token-prefix: Bearer 
  # Header 名称
  header: Authorization

# ==========================================
# 日志配置
# ==========================================
logging:
  level:
    # 根日志级别
    root: INFO
    # 项目日志级别
    com.hiking: DEBUG
    # MyBatis 日志
    com.hiking.mapper: DEBUG
    # Spring Security 日志
    org.springframework.security: DEBUG
  # 日志文件配置
  file:
    # 日志文件路径
    path: ./logs
    # 日志文件名
    name: ./logs/outdoor-hiking.log
  # 日志格式
  pattern:
    # 控制台日志格式
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    # 文件日志格式
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# ==========================================
# 服务器配置
# ==========================================
server:
  # 端口号
  port: 8080
  servlet:
    # 应用上下文路径
    context-path: /
    # 编码
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Tomcat 配置
  tomcat:
    # URI 编码
    uri-encoding: UTF-8
    # 最大线程数
    threads:
      max: 200
      min-spare: 10
    # 最大连接数
    max-connections: 10000
    # 连接超时时间 (毫秒)
    connection-timeout: 60000

 

# ==========================================
# 管理端点配置
# ==========================================
management:
  endpoints:
    web:
      exposure:
        # 暴露的端点
        include: health,info,metrics
  endpoint:
    health:
      # 显示详细信息
      show-details: when-authorized

