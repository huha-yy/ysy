# MyBatis Plus 开发环境配置
mybatis-plus:
  configuration:
    # 开启SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志级别 - 开发环境
logging:
  level:
    root: INFO
    com.hiking: DEBUG
    com.hiking.mapper: DEBUG

